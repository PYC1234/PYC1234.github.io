<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">AI 壁纸质量评估的完整工作链路</title><desc id="desc">业务规则拆解、评级维度定义、提示词设计、批量评测、错误归因和迭代复测组成持续优化闭环。</desc><rect width="1200" height="750" fill="#eeede7"/><g font-family="Microsoft YaHei, sans-serif" fill="#242622"><text x="60" y="60" font-size="17" fill="#5a5d56">BUSINESS RULES → PROMPT → EVALUATION</text><text x="60" y="116" font-size="38">把业务判断，转为可评测的 AI 任务</text><rect x="60" y="170" width="300" height="165" rx="4" fill="#fffefa" stroke="#c8cdbf"/><text x="84" y="206" font-size="17" fill="#465c44">01</text><text x="84" y="253" font-size="29">业务规则拆解</text><text x="84" y="294" font-size="18" fill="#5a5d56">分发要求 · 质量边界</text><rect x="450" y="170" width="300" height="165" rx="4" fill="#fffefa" stroke="#c8cdbf"/><text x="474" y="206" font-size="17" fill="#465c44">02</text><text x="474" y="253" font-size="29">评级维度定义</text><text x="474" y="294" font-size="18" fill="#5a5d56">人工标注 · 判断标准</text><rect x="840" y="170" width="300" height="165" rx="4" fill="#fffefa" stroke="#c8cdbf"/><text x="864" y="206" font-size="17" fill="#465c44">03</text><text x="864" y="253" font-size="29">提示词设计</text><text x="864" y="294" font-size="18" fill="#5a5d56">任务描述 · 正反例</text><rect x="840" y="400" width="300" height="165" rx="4" fill="#fffefa" stroke="#c8cdbf"/><text x="864" y="436" font-size="17" fill="#465c44">04</text><text x="864" y="483" font-size="29">批量评测</text><text x="864" y="524" font-size="18" fill="#5a5d56">固定样本 · 指标对比</text><rect x="450" y="400" width="300" height="165" rx="4" fill="#fffefa" stroke="#c8cdbf"/><text x="474" y="436" font-size="17" fill="#465c44">05</text><text x="474" y="483" font-size="29">错误案例归因</text><text x="474" y="524" font-size="18" fill="#5a5d56">误伤与漏放 · 边界分析</text><rect x="60" y="400" width="300" height="165" rx="4" fill="#fffefa" stroke="#c8cdbf"/><text x="84" y="436" font-size="17" fill="#465c44">06</text><text x="84" y="483" font-size="29">迭代与复测</text><text x="84" y="524" font-size="18" fill="#5a5d56">优化 Prompt · 同样本重跑</text><g stroke="#465c44" stroke-width="2" fill="none"><path d="M375 250h58m-10-7 10 7-10 7M765 250h58m-10-7 10 7-10 7M990 350v34m-7-10 7 10 7-10M823 480h-58m10-7-10 7 10 7M433 480h-58m10-7-10 7 10 7M210 580v52h780v-52m-7 10 7-10 7 10"/></g><text x="600" y="675" text-anchor="middle" font-size="20" fill="#465c44">规则与 Prompt 持续调整 → 在固定基准上验证改进</text><text x="60" y="720" font-size="15" fill="#5a5d56">个人工作链路示意 / 非产品界面</text></g></svg>